{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h4 class="mb-3">Student Registration</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Student ID</label>
            <input name="student_id" class="form-control" placeholder="e.g. 2500800" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input name="name" class="form-control" required>
          </div>
          <div class="row">
            <div class="col-8 mb-3">
              <label class="form-label">Course</label>
              <input name="course" class="form-control" placeholder="e.g. BSIT">
            </div>
            <div class="col-4 mb-3">
              <label class="form-label">Year</label>
              <input name="year" type="number" min="1" max="6" class="form-control">
            </div>
          </div>
          <button class="btn btn-primary w-100">Register</button>
        </form>
      </div>
    </div>
    <div class="text-center"><a href="{{ url_for('get_number') }}">Already registered? Get a queue number</a></div>
  </div>
</div>
{% endblock %}
