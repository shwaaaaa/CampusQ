{% extends "base.html" %}
{% block title %}Get a Queue Number{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h4 class="mb-3">Get a Queue Number</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Student ID</label>
            <input name="student_id" class="form-control" placeholder="e.g. 2024-0001" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Service</label>
            <select name="service_id" class="form-select" required>
              {% for s in services %}
              <option value="{{ s.service_id }}">{{ s.service_name }} ({{ s.counter }})</option>
              {% endfor %}
            </select>
          </div>
          <button class="btn btn-success w-100">Get queue number</button>
        </form>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h6>Already have a number?</h6>
        <form method="get" action="{{ url_for('my_queue') }}" class="d-flex gap-2">
          <input name="student_id" class="form-control" placeholder="Student ID" required>
          <button class="btn btn-outline-primary">Check</button>
        </form>
      </div>
    </div>

    <div class="text-center mb-2">Not registered yet? <a href="{{ url_for('register') }}">Register here</a></div>
    <div class="text-center"><a href="{{ url_for('board') }}">View Now Serving board</a></div>
  </div>
</div>
{% endblock %}
